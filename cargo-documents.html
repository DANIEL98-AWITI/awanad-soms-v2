<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AWANAD SOMS | Cargo Documents</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="top-header">

<div class="branding">

<div class="company-info">
<h1>AWANAD CFS</h1>
<h2>Stevedoring Operations Management System</h2>
</div>

<img src="ael-logo.png" class="company-logo">

</div>

</header>

<aside class="sidebar">

    <div class="menu-title">
        RORO DEPARTMENT
    </div>

    <a href="roro.html">
        🚗 <span>RORO Operations</span>
    </a>

    <a href="roro-vessels.html">
        🚢 <span>Vessel Updates</span>
    </a>

    <a class="active" href="cargo-documents.html">
        📑 <span>Cargo Documents</span>
    </a>

    <a href="reports.html">
        📊 <span>RORO Reports</span>
    </a>

    <a href="#" onclick="awanadLogout(); return false;">
        🚪 <span>Logout</span>
    </a>

</aside>

<main class="main-content">

<div class="page-header">

<h2>Cargo Documents Register</h2>

<p>Register Bills of Lading and Shipping Manifests</p>

</div>

<div class="panel">

<h3>Document Information</h3>

<br>

<label>Cargo Type</label>

<select id="cargoType" onchange="changeCargoType()">

<option>Container</option>

<option>RORO</option>

<option>Bulk & Packages</option>

</select>

<br><br>

<label>Vessel</label>

<input type="text" id="vessel">

<br><br>

<label>BL / Manifest Number</label>

<input type="text" id="documentNo">

<br><br>

<label>Shipping Line</label>

<input type="text" id="shippingLine">

<br><br>

<label>Customer</label>

<input type="text" id="customer">

<br><br>

<div id="containerSection">

<label>20FT Containers</label>

<input type="number" id="twenty">

<br><br>

<label>40FT Containers</label>

<input type="number" id="forty">

<br><br>

<label>Container Numbers</label>

<textarea
id="containerNumbers"
style="width:100%;height:180px;"
placeholder="One container per line"></textarea>

</div>

<div id="roroSection" style="display:none;">

<label>Total RORO Units</label>

<input type="number" id="roroUnits">

<br><br>

<label>Vehicle Details</label>

<textarea
id="roroNumbers"
style="width:100%;height:180px;"
placeholder="One unit per line

KDH123A,Toyota Prado
KDJ456B,Isuzu Dmax
KDA890P,Nissan Xtrail"></textarea>

</div>
<div id="bulkSection" style="display:none;">

<label>Commodity Type</label>

<select id="commodityType" onchange="loadCommodityList()">

<option value="">Select</option>

<option value="Bulk">Bulk Cargo</option>

<option value="Packages">Packages</option>

</select>

<br><br>

<label>Commodity</label>

<select id="bulkCargo">

<option>Select Commodity</option>

</select>

<br><br>

<label>Quantity</label>

<input
type="number"
id="bulkQuantity"
placeholder="Enter Quantity">

<br><br>

<label>Unit of Measure</label>

<input
type="text"
id="bulkUnit"
readonly>

</div>
<br><br>

<label>Container Numbers</label>

<textarea
id="containerNumbers"
placeholder="Paste one container number per line

Example:

MSCU1234567
MSCU7654321
OOLU1234567
TGHU9876543"
style="width:100%;height:180px;padding:12px;border-radius:10px;"></textarea>

<br><br>

<button onclick="saveDocument()">

SAVE DOCUMENT

</button>
</div>

</main>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script src="js/cargo-documents.js"></script>
<script>

function changeCargoType(){

    let cargo = document.getElementById("cargoType").value;

    document.getElementById("containerSection").style.display = "none";
    document.getElementById("roroSection").style.display = "none";
    document.getElementById("bulkSection").style.display = "none";

    if(cargo=="Container"){

        document.getElementById("containerSection").style.display="block";

    }

    if(cargo=="RORO"){

        document.getElementById("roroSection").style.display="block";

    }

   if(cargo=="Bulk & Packages"){

        document.getElementById("bulkSection").style.display="block";

    }

}

changeCargoType();

</script>
</body>

</html>
