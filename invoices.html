<main class="main-content">

<div class="page-header">

<h2>Invoice Register</h2>

<p>Create and Manage Customer Invoices</p>

</div>

<div class="panel">

<h3>Invoice Information</h3>

<br>

<label>Invoice Number</label>

<input type="text" id="invoiceNo">

<br><br>

<label>Invoice Date</label>

<input type="date" id="invoiceDate">

<br><br>

<label>Vessel</label>

<select id="invoiceVessel">

<option>Select Vessel</option>

</select>

<br><br>

<label>Customer</label>

<input type="text" id="invoiceCustomer">

<br><br>

<label>Cargo Category</label>

<input type="text" id="invoiceCategory">

<br><br>

<label>Commodity</label>

<input type="text" id="invoiceCommodity">

<br><br>

<label>Quantity</label>

<input type="number" id="invoiceQuantity">

<br><br>

<label>Unit</label>

<input type="text" id="invoiceUnit">

<br><br>

<label>Invoice Amount</label>

<input type="number" id="invoiceAmount">

<br><br>

<label>Status</label>

<select id="invoiceStatus">

<option>Pending</option>

<option>Paid</option>

</select>

<br><br>

<button>

SAVE INVOICE

</button>

</div>

</main>
