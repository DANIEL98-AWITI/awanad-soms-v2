<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>AWANAD SOMS | Login</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <!-- LOGO -->

        <img
            src="ael-logo.png"
            class="login-logo"
            alt="AWANAD CFS Logo"
        >


        <!-- TITLE -->

        <h1>AWANAD SOMS</h1>

        <p class="login-subtitle">
            Stevedoring Operations Management System
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                LOGIN
            </button>

        </form>


        <!-- LOGIN MESSAGE -->

        <div
            id="loginMessage"
            class="login-message"
        ></div>


        <!-- FOOTER -->

        <div class="login-footer">

            © 2026 AWANAD CFS

        </div>

    </div>

</div>


<!-- LOGIN SCRIPT -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("loginForm");

    const message = document.getElementById("loginMessage");


    form.addEventListener("submit", function (event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value
                .trim();


        /*
        ==========================================
        ADMIN
        ==========================================
        */

        if (
            username === "admin" &&
            password === "admin123"
        ) {

            sessionStorage.setItem(
                "awanadLoggedIn",
                "true"
            );

            sessionStorage.setItem(
                "awanadRole",
                "ADMIN"
            );

            sessionStorage.setItem(
                "awanadUsername",
                "admin"
            );

            window.location.href =
                "./dashboard.html";

            return;
        }


        /*
        ==========================================
        RORO
        ==========================================
        */

        if (
            username === "roro" &&
            password === "roro123"
        ) {

            sessionStorage.setItem(
                "awanadLoggedIn",
                "true"
            );

            sessionStorage.setItem(
                "awanadRole",
                "RORO"
            );

            sessionStorage.setItem(
                "awanadUsername",
                "roro"
            );

            window.location.href =
                "./roro.html";

            return;
        }


        /*
        ==========================================
        CONTAINER
        ==========================================
        */

        if (
            username === "container" &&
            password === "container123"
        ) {

            sessionStorage.setItem(
                "awanadLoggedIn",
                "true"
            );

            sessionStorage.setItem(
                "awanadRole",
                "CONTAINER"
            );

            sessionStorage.setItem(
                "awanadUsername",
                "container"
            );

            window.location.href =
                "./containers.html";

            return;
        }


        /*
        ==========================================
        BULK
        ==========================================
        */

        if (
            username === "bulk" &&
            password === "bulk123"
        ) {

            sessionStorage.setItem(
                "awanadLoggedIn",
                "true"
            );

            sessionStorage.setItem(
                "awanadRole",
                "BULK"
            );

            sessionStorage.setItem(
                "awanadUsername",
                "bulk"
            );

            window.location.href =
                "./bulk.html";

            return;
        }


        /*
        ==========================================
        FINANCE
        ==========================================
        */

        if (
            username === "finance" &&
            password === "finance123"
        ) {

            sessionStorage.setItem(
                "awanadLoggedIn",
                "true"
            );

            sessionStorage.setItem(
                "awanadRole",
                "FINANCE"
            );

            sessionStorage.setItem(
                "awanadUsername",
                "finance"
            );

            window.location.href =
                "./invoices.html";

            return;
        }


        /*
        ==========================================
        WRONG LOGIN
        ==========================================
        */

        message.textContent =
            "Invalid username or password.";

        message.className =
            "login-message error";

    });

});

</script>


</body>

</html>
